services:
  postgres:
    image: postgres:16-alpine
    container_name: investment-openapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment_openapi}
      POSTGRES_USER: ${POSTGRES_USER:-hyuki}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-test1234!@#$$}"
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
