plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hyuki'
version = '1.0'
description = 'investment-openAPI'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Lombok annotation processing
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('dockerBuild', Exec) {
    group = 'local development'
    description = 'Runs tests and builds the local application Docker image.'
    dependsOn tasks.named('test')
    commandLine 'docker', 'compose', 'build', 'app'
}

tasks.register('localUp', Exec) {
    group = 'local development'
    description = 'Builds and starts the local application, PostgreSQL, and Redis.'
    dependsOn tasks.named('dockerBuild')
    commandLine 'docker', 'compose', 'up', '--detach', '--wait'
}

tasks.register('localDown', Exec) {
    group = 'local development'
    description = 'Stops local containers without deleting database volumes.'
    commandLine 'docker', 'compose', 'down'
}
