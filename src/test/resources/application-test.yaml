spring:
  datasource:
    url: jdbc:h2:mem:investment_openapi_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true

security:
  account-number:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    hash-key: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
  jwt:
    issuer: investment-openapi-test
    audience: investment-openapi-test-clients
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-token-ttl: PT30M
    refresh-token-ttl: PT24H
