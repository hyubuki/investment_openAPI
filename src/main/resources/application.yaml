spring:
  application:
    name: investment_openAPI

  profiles:
    default: local

  jpa:
    open-in-view: false

security:
  account-number:
    encryption-key: ${ACCOUNT_NUMBER_ENCRYPTION_KEY}
    hash-key: ${ACCOUNT_NUMBER_HASH_KEY}
  login:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:PT15M}
  jwt:
    issuer: ${JWT_ISSUER:investment-openapi}
    audience: ${JWT_AUDIENCE:investment-openapi-clients}
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:PT24H}
